<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" role="img" aria-label="Teleskoplader mit Hubkorb">
  <rect width="560" height="380" fill="#f2f5f8"/>
  <rect y="300" width="560" height="80" fill="#d8dee4"/>
  <rect y="296" width="560" height="6" fill="#c2cad1"/>
  <!-- wall -->
  <g stroke="#a9b6c1" stroke-width="3" fill="#e9eef2">
    <rect x="400" y="90" width="140" height="210"/>
    <line x1="400" y1="145" x2="540" y2="145"/><line x1="400" y1="200" x2="540" y2="200"/><line x1="400" y1="255" x2="540" y2="255"/>
  </g>
  <!-- boom -->
  <g stroke="#132436" stroke-width="4" stroke-linecap="round">
    <line x1="180" y1="200" x2="405" y2="120"/>
    <line x1="186" y1="216" x2="412" y2="134"/>
    <line x1="240" y1="180" x2="245" y2="199"/><line x1="300" y1="160" x2="305" y2="179"/><line x1="360" y1="140" x2="365" y2="159"/>
  </g>
  <!-- basket with worker -->
  <g>
    <rect x="398" y="96" width="52" height="34" rx="4" fill="#9fb0bd" stroke="#132436" stroke-width="3"/>
    <circle cx="424" cy="84" r="9" fill="#f2c9a0" stroke="#132436" stroke-width="2.5"/>
    <rect x="416" y="92" width="16" height="10" fill="#f2a81d" stroke="#132436" stroke-width="2"/>
  </g>
  <!-- telehandler body -->
  <g>
    <path d="M60 232 h150 l24 -34 h44 v56 h-190 q-28 0 -28 -22 z" fill="#f2a81d" stroke="#132436" stroke-width="3"/>
    <rect x="84" y="186" width="56" height="34" rx="5" fill="#eef3f7" stroke="#132436" stroke-width="2.5"/>
    <circle cx="96" cy="272" r="24" fill="#2b3a47" stroke="#132436" stroke-width="3"/>
    <circle cx="204" cy="272" r="24" fill="#2b3a47" stroke="#132436" stroke-width="3"/>
    <circle cx="96" cy="272" r="8" fill="#9fb0bd"/><circle cx="204" cy="272" r="8" fill="#9fb0bd"/>
  </g>
  <text x="18" y="358" font-family="Helvetica,Arial" font-size="14" fill="#8b98a4">Illustrativ — Teleskoplader mit Hubkorb</text>
</svg>
